<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Kazz | Research & Sport</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --surface: #141414;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-turquoise: #00e5ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        h1, h2, h3, .logo {
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        /* Navbar */
        header {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--neon-green);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--neon-turquoise);
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 9rem auto 5rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            line-height: 1.05;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .hero-content h1 span {
            color: var(--neon-yellow);
            background: #1a1a00;
            padding: 0 5px;
        }

        .hero-content p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
        }

        .btn {
            display: inline-block;
            background: var(--neon-green);
            color: #000 !important;
            padding: 0.85rem 1.75rem;
            border-radius: 0px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: transform 0.1s, background 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: #00cc52;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--neon-turquoise) !important;
            border: 2px solid var(--neon-turquoise);
        }

        .btn-outline:hover {
            background: var(--neon-turquoise);
            color: #000 !important;
        }

        .btn-join {
            display: block;
            width: 100%;
            background-color: #000000;
            color: var(--neon-green) !important;
            border: 2px solid var(--neon-green);
            text-align: center;
            padding: 0.8rem 1rem;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-decoration: none;
            margin-top: 1rem;
            transition: background 0.2s, color 0.2s;
        }

        .btn-join:hover {
            background-color: var(--neon-green);
            color: #000000 !important;
            text-decoration: none;
        }

        .hero-img-wrapper {
            position: relative;
        }

        .hero-img-wrapper::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 100%;
            height: 100%;
            border: 2px solid var(--neon-turquoise);
            z-index: -1;
        }

        .hero-img img {
            width: 100%;
            aspect-ratio: 4/5;
            object-fit: cover;
            filter: grayscale(20%) contrast(110%);
        }

            max-width: 1200px
