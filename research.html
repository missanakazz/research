<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>The Research | Ana Kazz</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --surface: #141414;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-turquoise: #00e5ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        /* Navbar */
        header {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--neon-green);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--neon-turquoise);
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 9rem auto 5rem;
            padding: 0 2rem;
        }

        .page-title {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .page-title span {
            color: var(--neon-yellow);
        }

        .section-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 2.5rem;
            margin-bottom: 3rem;
            position: relative;
        }

        .section-box h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-box h3 {
            font-size: 1.2rem;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--neon-turquoise);
        }

        .section-box p, .section-box li {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 1rem;
        }

        .section-box ul {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .market-card {
            background: #1a1a1a;
            border: 1px solid var(--border);
            padding: 1.5rem;
        }

        .market-card h4 {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        /* Estilo para os blocos de Counterparts */
        .counterpart-item {
            background: #1c1c1c;
            border-left: 4px solid var(--neon-yellow);
            margin-bottom: 1.5rem;
            padding: 1.5rem;
        }

        .counterpart-title {
            display: inline-block;
            background: var(--neon-yellow);
            color: #000;
            padding: 0.3rem 0.8rem;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .counterpart-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .counterpart-text strong {
            color: var(--text-main);
        }

        .btn-back {
            display: inline-block;
            background: transparent;
            color: var(--neon-turquoise);
            border: 2px solid var(--neon-turquoise);
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            transition: background 0.2s, color 0.2s;
        }

        .btn-back:hover {
            background: var(--neon-turquoise);
            color: #000;
        }

        /* Imagem ajustada para não cortar (object-fit: contain) */
        .content-img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            background-color: #141414;
            border-radius: 4px;
            margin-bottom: 3rem;
            border: 1px solid var(--border);
            padding: 1rem;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 3rem 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer span {
            color: var(--neon-green);
        }
    </style>
</head>

            </ul>
        </div>
    </header>
